  build-Chargeworker:
    name: Build, Push Card Charge Worker & Deploy to ECS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:  eu-north-1 #${{ secrets.AWS_REGION }}
        
      - name: Login to Amazon ECR for Worker
        id: login-ecr-worker
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and Push Worker Docker Image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr-worker.outputs.registry }}
          ECR_REPOSITORY: cardcharge
          IMAGE_TAG: latest
        run: |
          docker build -f Dockerfile.cardChargeworker -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Update ECS Task Definition for Worker
        id: task-def-worker
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ./cardCharge.json #${{ secrets.ECS_TASK_DEFINITION_CARDCHARGEWORKER }}
          container-name: "cardcharge"
          image: ${{ steps.login-ecr-worker.outputs.registry }}/cardcharge:latest  # cardcharge

      - name: Deploy to Amazon ECS for Worker
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def-worker.outputs.task-definition }}
          service: cardchargeWorker #${{ secrets.ECS_SERVICE_NAME_CARDCHARGEWORKER }}
          cluster: drop-ride-cluster-ecs #${{ secrets.ECS_CLUSTER_NAME }}
          wait-for-service-stability: true




