deploy:
  needs: build
  runs-on: [drop-ride-aws-ec2] # GitHub self-hosted runner
  steps:
    - name: SSH into Server and Deploy
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          set +x
          echo "📄 Creating .env file..."
          cat <<EOL > .env
          GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_CALLBACK_URL=${{ secrets.GOOGLE_CALLBACK_URL }}
          DATABASE_PROVIDER=${{ secrets.DATABASE_PROVIDER }}
          PORT=${{ secrets.PORT }}
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          JWT_ACCESS_TOKEN_SECRET=${{ secrets.JWT_ACCESS_TOKEN_SECRET }}
          JWT_REFRESH_TOKEN_SECRET=${{ secrets.JWT_REFRESH_TOKEN_SECRET }}
          POSTMARK_SERVER_TOKEN=${{ secrets.POSTMARK_SERVER_TOKEN }}
          DROP_INNOVATION_EMAIL=${{ secrets.DROP_INNOVATION_EMAIL }}
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          EOL
          set -x

          echo "🚀 Pulling latest Docker image..."
          docker pull ${{ secrets.DROP_RIDE_DOCKER_USER }}/drop-app-backend:latest

          echo "🛑 Stopping and removing old container..."
          docker stop drop-app-backend || true
          docker rm drop-app-backend || true

          echo "🧹 Removing old unused images..."
          docker image prune -af || true

          echo "🚀 Starting new container..."
          docker run -d --name drop-app-backend -p 5150:5150 --env-file .env \
            ${{ secrets.DROP_RIDE_DOCKER_USER }}/drop-app-backend:latest

          echo "🩺 Checking app health..."
          sleep 10
          curl -f http://localhost:5150/health || (echo "❌ Health check failed! Rolling back..." && docker logs drop-app-backend && exit 1)

          echo "✅ Deployment completed!"
